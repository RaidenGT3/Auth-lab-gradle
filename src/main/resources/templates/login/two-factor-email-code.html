<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Email OTP認証</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, "Noto Sans JP", sans-serif;
        }

        .container {
            width: 420px;
            padding: 40px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
            font-size: 26px;
        }

        .step {
            margin-bottom: 25px;
            text-align: center;
            color: #666;
            font-size: 15px;
        }

        .description {
            margin-bottom: 30px;
            text-align: center;
            color: #666;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 3px;
        }

        .button {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #555;
        }

        .error {
            margin-top: 15px;
            color: #d00;
            text-align: center;
        }

        .back {
            margin-top: 20px;
            text-align: center;
        }

        .back a {
            color: #333;
            text-decoration: none;
        }

        .back a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>二要素認証</h1>

        <div class="step">
            第2段階：Email OTP
        </div>

        <p class="description">
            メールに届いた6桁の認証コードを<br>
            入力してください。
        </p>

        <form th:action="@{/login/two-factor/email/code}"
              method="post">

            <div class="form-group">

                <label for="code">
                    認証コード
                </label>

                <input
                    type="text"
                    id="code"
                    name="code"
                    maxlength="6"
                    minlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    placeholder="6桁のコード"
                    required>

            </div>

            <div class="error"
                 th:if="${error}"
                 th:text="${error}">
            </div>

            <button type="submit"
                    class="button">
                認証
            </button>

        </form>

        <div class="back">

            <a th:href="@{/login/two-factor/email}">
                認証コードをもう一度送信する
            </a>

            <a th:href="@{/auth}">
                認証方式選択に戻る
            </a>

        </div>

    </div>

</body>

</html>
