<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>三段階認証ログイン</title>
</head>

<body>

<h1>三段階認証ログイン</h1>

<p>
    ユーザー名とパスワードを入力してください。
</p>

<form action="/login/three-stage" method="post">

    <div>
        <label>ユーザー名</label>

        <input type="text"
               name="username"
               required>
    </div>

    <br>

    <div>
        <label>パスワード</label>

        <input type="password"
               name="password"
               required>
    </div>

    <br>

    <button type="submit">
        次へ
    </button>

</form>

<div th:if="${error}">
    <p th:text="${error}"></p>
</div>

<p>
    <a href="/auth">
        認証方式選択に戻る
    </a>
</p>

</body>

</html>
