<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>一段階認証ログイン</title>
</head>
<body>

<h1>一段階認証ログイン</h1>

<form action="/login/one-stage" method="post">

    <div>
        <label>ユーザー名</label>
        <input type="text"
               name="username"
               required>
    </div>

    <div>
        <label>パスワード</label>
        <input type="password"
               name="password"
               required>
    </div>

    <button type="submit">
        ログイン
    </button>

</form>

<p>
    <a href="/auth">
        認証方式選択に戻る
    </a>
</p>

</body>
</html>
