<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>三段階認証 - パスワード3</title>

</head>

<body>

<h1>三段階認証</h1>

<p>3段階目：パスワード3</p>

<form action="/login/three-stage/password3" method="post">

    <div>

        <label>パスワード3</label>

        <input type="password"
               name="password3"
               required>

    </div>

    <button type="submit">

        ログイン

    </button>

</form>

<div th:if="${error}">

    <p th:text="${error}"></p>

</div>

<p>

    <a href="/auth">

        認証方式選択に戻る

    </a>

</p>

</body>

</html>
