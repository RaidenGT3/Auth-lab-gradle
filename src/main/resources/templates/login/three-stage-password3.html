<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>三段階認証 - パスワード3</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #f5f5f5;

            font-family: Arial, "Noto Sans JP", sans-serif;
        }

        .container {
            width: 420px;

            padding: 40px;

            background-color: white;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;

            text-align: center;

            font-size: 26px;
        }

        .step {
            margin-bottom: 30px;

            text-align: center;

            color: #666;

            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;
        }

        input[type="password"] {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;
        }

        .button {
            width: 100%;

            margin-top: 10px;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background-color: #333;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .button:hover {
            background-color: #555;
        }

        .error {
            margin-top: 15px;

            color: #d00;

            text-align: center;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>三段階認証</h1>

        <div class="step">
            3段階目：パスワード3
        </div>

        <form action="/login/three-stage/password3"
              method="post">

            <div class="form-group">

                <label for="password3">
                    パスワード3
                </label>

                <input type="password"
                       id="password3"
                       name="password3"
                       required>

            </div>

            <button type="submit"
                    class="button">

                ログイン

            </button>

        </form>

        <div class="error"
             th:if="${error}">

            <p th:text="${error}"></p>

        </div>

    </div>

</body>

</html>
