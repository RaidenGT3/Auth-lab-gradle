<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>一要素認証</title>
</head>

<body>

    <h1>一要素認証</h1>

    <p>
        認証方法を1つ選択してください。
    </p>

    <form th:action="@{/login/one-factor/select}" method="post">

        <div>
            <label>
                <input
                    type="radio"
                    name="factor"
                    value="password"
                    required>

                パスワード
            </label>
        </div>

        <br>

        <div>
            <label>
                <input
                    type="radio"
                    name="factor"
                    value="email">

                メール認証コード
            </label>
        </div>

        <br>

        <div>
            <label>
                <input
                    type="radio"
                    name="factor"
                    value="passkey">

                Passkey
            </label>
        </div>

        <br>

        <button type="submit">
            次へ
        </button>

    </form>

    <br>

    <a th:href="@{/auth}">
        認証方式選択に戻る
    </a>

</body>

</html>
