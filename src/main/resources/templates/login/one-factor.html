<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<meta name="viewport"
	      content="width=device-width, initial-scale=1.0">

	<title>一要素認証</title>

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			background-color: #f5f5f5;
			font-family: Arial, "Noto Sans JP", sans-serif;
		}

		.container {
			width: 450px;
			padding: 40px;
			background-color: white;
			border-radius: 12px;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
		}

		h1 {
			margin-top: 0;
			margin-bottom: 30px;
			text-align: center;
			font-size: 26px;
		}

		.description {
			margin-bottom: 25px;
			text-align: center;
		}

		.auth-option {
			display: block;
			margin-bottom: 12px;
			padding: 16px;
			border: 1px solid #ddd;
			border-radius: 8px;
			cursor: pointer;
		}

		.auth-option:hover {
			background-color: #f7f7f7;
		}

		.auth-option input {
			margin-right: 10px;
		}

		.button {
			width: 100%;
			margin-top: 15px;
			padding: 13px;
			border: none;
			border-radius: 6px;
			background-color: #333;
			color: white;
			font-size: 16px;
			cursor: pointer;
		}

		.button:hover {
			background-color: #555;
		}

		.back {
			margin-top: 20px;
			text-align: center;
		}

		.back a {
			color: #333;
			text-decoration: none;
		}

		.back a:hover {
			text-decoration: underline;
		}
	</style>

</head>

<body>

	<div class="container">

		<h1>一要素認証</h1>

		<p class="description">
			認証方法を1つ選択してください。
		</p>

		<form th:action="@{/login/one-factor/select}"
		      method="post">

			<!-- パスワード認証 -->
			<label class="auth-option">

				<input type="radio"
				       name="factor"
				       value="password"
				       required>

				パスワード

			</label>

			<!-- メール認証 -->
			<label class="auth-option">

				<input type="radio"
				       name="factor"
				       value="email">

				メール認証コード

			</label>

			<button type="submit"
			        class="button">
				次へ
			</button>

		</form>

		<div class="back">

			<a th:href="@{/auth}">
				認証方式選択に戻る
			</a>

		</div>

	</div>

</body>

</html>
