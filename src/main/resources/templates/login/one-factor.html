<!DOCTYPE html>
<html lang="ja">

<head>

	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>一要素認証</title>

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			background-color: #f5f5f5;
			font-family: Arial, "Noto Sans JP", sans-serif;
		}

		.container {
			width: 450px;
			padding: 40px;
			background-color: white;
			border-radius: 12px;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
		}

		h1 {
			margin-top: 0;
			margin-bottom: 30px;
			text-align: center;
			font-size: 26px;
		}

		.auth-option {
			display: block;
			margin-bottom: 12px;
			padding: 16px;
			border: 1px solid #ddd;
			border-radius: 8px;
			cursor: pointer;
		}

		.auth-option:hover {
			background-color: #f7f7f7;
		}

		.auth-option input {
			margin-right: 10px;
		}

		.button {
			width: 100%;
			margin-top: 15px;
			padding: 13px;
			border: none;
			border-radius: 6px;
			background-color: #333;
			color: white;
			font-size: 16px;
			cursor: pointer;
		}

		.button:hover {
			background-color: #555;
		}
	</style>

</head>

<body>

	<div class="container">

		<h1>一要素認証</h1>

		<form id="authForm">

			<!-- 知識認証 -->
			<label class="auth-option">

				<input type="radio" name="authType" value="knowledge" required>

				知識認証

			</label>


			<!-- 所有認証 -->
			<label class="auth-option">

				<input type="radio" name="authType" value="possession">

				所有認証

			</label>


			<!-- 生体認証 -->
			<label class="auth-option">

				<input type="radio" name="authType" value="biometric">

				生体認証

			</label>


			<button type="submit" class="button">
				次へ
			</button>

		</form>

	</div>


	<script>

		document.getElementById("authForm").addEventListener("submit", function (event) {

			event.preventDefault();

			const authType = document.querySelector(
				'input[name="authType"]:checked'
			).value;


			if (authType === "knowledge") {

				window.location.href = "/login";

			} else if (authType === "possession") {

				window.location.href = "/email";

			} else if (authType === "biometric") {

				alert("生体認証は現在準備中です");

			}

		});

	</script>

</body>

</html>
