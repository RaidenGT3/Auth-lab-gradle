<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Password認証</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, "Noto Sans JP", sans-serif;
        }

        .container {
            width: 420px;
            padding: 40px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
            font-size: 26px;
        }

        .step {
            margin-bottom: 30px;
            text-align: center;
            color: #666;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .button {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #555;
        }

        .error {
            margin-top: 15px;
            color: #d00;
            text-align: center;
        }

        .back {
            margin-top: 20px;
            text-align: center;
        }

        .back a {
            color: #333;
            text-decoration: none;
        }

        .back a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>二要素認証</h1>

        <div class="step">
            第1段階：Password
        </div>

        <form th:action="@{/login/two-factor/password}"
              method="post">

            <div class="form-group">

                <label for="username">
                    ユーザー名
                </label>

                <input type="text"
                       id="username"
                       name="username"
                       required
                       autocomplete="username">

            </div>

            <div class="form-group">

                <label for="password">
                    パスワード
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       required
                       autocomplete="current-password">

            </div>

            <div class="error"
                 th:if="${error}"
                 th:text="${error}">
            </div>

            <button type="submit"
                    class="button">
                次へ
            </button>

        </form>

        <div class="back">

            <a th:href="@{/auth}">
                認証方式選択に戻る
            </a>

        </div>

    </div>

</body>

</html>
