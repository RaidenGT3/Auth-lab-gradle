<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Passkeyログイン</title>
</head>

<body>

    <h1>Passkeyでログイン</h1>

    <p>
        登録済みのPasskeyを使用してログインします。
    </p>

    <button type="button" id="loginPasskey">
        Passkeyでログイン
    </button>

    <p id="message"></p>


    <script>

        // Base64URL → ArrayBuffer
        function base64UrlToArrayBuffer(base64Url) {

            const padding =
                "=".repeat(
                    (4 - base64Url.length % 4) % 4
                );

            const base64 =
                (base64Url + padding)
                    .replace(/-/g, "+")
                    .replace(/_/g, "/");

            const binary =
                window.atob(base64);

            const bytes =
                new Uint8Array(binary.length);

            for (let i = 0; i < binary.length; i++) {

                bytes[i] =
                    binary.charCodeAt(i);
            }

            return bytes.buffer;
        }


        // ArrayBuffer → Base64URL
        function arrayBufferToBase64Url(buffer) {

            const bytes =
                new Uint8Array(buffer);

            let binary = "";

            for (const byte of bytes) {

                binary +=
                    String.fromCharCode(byte);
            }

            return window.btoa(binary)
                .replace(/\+/g, "-")
                .replace(/\//g, "_")
                .replace(/=/g, "");
        }


        document
            .getElementById("loginPasskey")
            .addEventListener(
                "click",
                async function () {

                    const message =
                        document.getElementById("message");


                    try {

                        /*
                         * ① 認証オプションを取得
                         */
                        message.textContent =
                            "Passkey認証を開始しています……";


                        const optionsResponse =
                            await fetch(
                                "/webauthn/authenticate/options",
                                {
                                    method: "POST",
                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    }
                                }
                            );


                        if (!optionsResponse.ok) {

                            throw new Error(
                                "Passkey認証オプションの取得に失敗しました。"
                            );
                        }


                        const options =
                            await optionsResponse.json();


                        const publicKey =
                            options.publicKey || options;


                        /*
                         * ② challengeを変換
                         */
                        if (publicKey.challenge) {

                            publicKey.challenge =
                                base64UrlToArrayBuffer(
                                    publicKey.challenge
                                );
                        }


                        /*
                         * ③ allowCredentialsを変換
                         */
                        if (
                            publicKey.allowCredentials
                        ) {

                            publicKey.allowCredentials =
                                publicKey.allowCredentials
                                    .map(function (credential) {

                                        return {

                                            ...credential,

                                            id:
                                                base64UrlToArrayBuffer(
                                                    credential.id
                                                )
                                        };
                                    });
                        }


                        /*
                         * ④ ブラウザでPasskey認証
                         */
                        const credential =
                            await navigator.credentials.get(
                                {
                                    publicKey:
                                        publicKey
                                }
                            );


                        if (!credential) {

                            throw new Error(
                                "Passkey認証がキャンセルされました。"
                            );
                        }


                        /*
                         * ⑤ 認証情報を作成
                         */
                        const credentialData = {

                            publicKey: {

                                credential: {

                                    id:
                                        credential.id,

                                    rawId:
                                        arrayBufferToBase64Url(
                                            credential.rawId
                                        ),

                                    response: {

                                        authenticatorData:
                                            arrayBufferToBase64Url(
                                                credential.response
                                                    .authenticatorData
                                            ),

                                        clientDataJSON:
                                            arrayBufferToBase64Url(
                                                credential.response
                                                    .clientDataJSON
                                            ),

                                        signature:
                                            arrayBufferToBase64Url(
                                                credential.response
                                                    .signature
                                            ),

                                        userHandle:
                                            credential.response
                                                .userHandle
                                                ? arrayBufferToBase64Url(
                                                    credential.response
                                                        .userHandle
                                                )
                                                : null
                                    },

                                    type:
                                        credential.type,

                                    clientExtensionResults:
                                        credential
                                            .getClientExtensionResults(),

                                    authenticatorAttachment:
                                        credential
                                            .authenticatorAttachment
                                }
                            }
                        };


                        /*
                         * ⑥ Spring Securityで認証
                         */
                        const authenticateResponse =
                            await fetch(
                                "/webauthn/authenticate",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            credentialData
                                        )
                                }
                            );


                        if (!authenticateResponse.ok) {

                            const errorText =
                                await authenticateResponse.text();

                            console.error(
                                "Passkey認証エラー:",
                                errorText
                            );

                            throw new Error(
                                "Passkey認証に失敗しました。"
                            );
                        }


                        /*
                         * ⑦ ログイン成功
                         */
                        message.textContent =
                            "ログインしました。";


                        window.location.href =
                            "/";


                    } catch (error) {

                        console.error(error);

                        message.textContent =
                            error.message ||
                            "Passkey認証中にエラーが発生しました。";
                    }

                }
            );

    </script>

</body>

</html>
