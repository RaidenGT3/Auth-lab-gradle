<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>一要素認証 - Password</title>
</head>

<body>

<h1>一要素認証</h1>

<h2>Password</h2>

<p>ユーザー名とパスワードを入力してください。</p>

<form action="/login/one-factor/password" method="post">

    <div>
        <label>ユーザー名</label>
        <input type="text"
               name="username"
               required>
    </div>

    <br>

    <div>
        <label>パスワード</label>
        <input type="password"
               name="password"
               required>
    </div>

    <br>

    <button type="submit">
        ログイン
    </button>

</form>

<div th:if="${error}">
    <p th:text="${error}"></p>
</div>

<p>
    <a href="/login/one-factor">
        認証要素の選択に戻る
    </a>
</p>

<p>
    <a href="/auth">
        認証方式選択に戻る
    </a>
</p>

</body>

</html>
