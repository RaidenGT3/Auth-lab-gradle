<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Password2入力</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, "Noto Sans JP", sans-serif;
        }

        .container {
            width: 420px;
            padding: 40px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            text-align: center;
            font-size: 26px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .button {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #555;
        }

        .error {
            margin-top: 15px;
            color: #d00;
            text-align: center;
        }

        .back {
            margin-top: 20px;
            text-align: center;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Password2入力</h1>

    <!--
        通常のPassword2入力
    -->
    <form action="/login/two-stage/password2"
          method="post">

        <div class="form-group">

            <label for="password2">
                Password2
            </label>

            <input type="password"
                   id="password2"
                   name="password2"
                   required>

        </div>

        <button type="submit"
                class="button">
            次へ
        </button>

    </form>

    <div class="error"
         th:if="${error}">

        <p th:text="${error}"></p>

    </div>

    <div class="back">

        <a href="/login/two-stage">
            戻る
        </a>

    </div>

</div>

<!--
    attacksimulatorから来た場合の自動送信
-->
<form id="attackSimulatorPassword2Form"
      action="/login/two-stage/password2"
      method="post"
      th:if="${session.fromAttackSimulatorPassword2 != null}">

    <input type="hidden"
           name="password2"
           th:value="${session.fromAttackSimulatorPassword2}">

</form>

<script th:if="${session.fromAttackSimulatorPassword2 != null}">

    document
        .getElementById(
            "attackSimulatorPassword2Form"
        )
        .submit();

</script>

</body>
</html>
