<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>三段階認証 - パスワード2</title>

</head>

<body>

<h1>三段階認証</h1>

<p>2段階目：パスワード2</p>

<form action="/login/three-stage/password2" method="post">

    <div>

        <label>パスワード2</label>

        <input type="password"
               name="password2"
               required>

    </div>

    <button type="submit">

        次へ

    </button>

</form>

<div th:if="${error}">

    <p th:text="${error}"></p>

</div>

<p>

    <a href="/auth">

        認証方式選択に戻る

    </a>

</p>

</body>

</html>
