<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ホーム</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, "Noto Sans JP", sans-serif;
        }

        .container {
            width: 420px;
            padding: 40px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .message {
            margin-bottom: 30px;
            color: #666;
            font-size: 16px;
        }

        .button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #555;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>ログイン成功！</h1>

        <p class="message">
            ログインしています。
        </p>

        <form action="/logout" method="post">

            <button type="submit"
                    class="button">
                ログアウト
            </button>

        </form>

    </div>

</body>

</html>
