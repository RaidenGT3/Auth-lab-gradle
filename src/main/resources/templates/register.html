<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ユーザー登録</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, "Noto Sans JP", sans-serif;
        }

        .container {
            width: 450px;
            padding: 40px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            text-align: center;
            font-size: 26px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .button {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #555;
        }

        .error {
            margin-top: 15px;
            color: #d00;
            text-align: center;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
        }

        .login-link a {
            color: #333;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>ユーザー登録</h1>

        <form action="/register"
              method="post">

            <!-- ユーザー名 -->
            <div class="form-group">

                <label>ユーザー名</label>

                <input type="text"
                       name="username"
                       required>

            </div>

            <!-- パスワード1 -->
            <div class="form-group">

                <label>パスワード1</label>

                <input type="password"
                       name="password"
                       required>

            </div>

            <!-- パスワード2 -->
            <div class="form-group">

                <label>パスワード2</label>

                <input type="password"
                       name="password2"
                       required>

            </div>

            <!-- パスワード3 -->
            <div class="form-group">

                <label>パスワード3</label>

                <input type="password"
                       name="password3"
                       required>

            </div>

            <!-- メールアドレス -->
            <div class="form-group">

                <label>メールアドレス</label>

                <input type="email"
                       name="email"
                       required>

            </div>

            <!-- 登録 -->
            <button type="submit"
                    class="button">

                登録

            </button>

        </form>

        <!-- エラー表示 -->
        <div class="error"
             th:if="${error}">

            <p th:text="${error}"></p>

        </div>

        <!-- 認証方式選択に戻る -->
        <div class="login-link">

            <a href="/auth">
                認証方式選択に戻る
            </a>

        </div>

    </div>

</body>

</html>
