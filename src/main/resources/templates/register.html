<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>
</head>

<body>

<h1>ユーザー登録</h1>

<form action="/register" method="post">

    <div>
        <label>ユーザー名</label>

        <input type="text"
               name="username"
               required>
    </div>

    <br>

    <div>
        <label>パスワード</label>

        <input type="password"
               name="password"
               required>
    </div>

    <br>

    <div>
        <label>メールアドレス</label>

        <input type="email"
               name="email"
               required>
    </div>

    <br>

    <button type="submit">
        登録
    </button>

</form>

<div th:if="${error}">
    <p th:text="${error}"></p>
</div>

<p>
    <a href="/login">
        ログインはこちら
    </a>
</p>

</body>

</html>
