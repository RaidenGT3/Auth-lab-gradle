<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Passkey登録</title>
</head>

<body>

    <h1>Passkeyを登録</h1>

    <p>
        ユーザー：
        <strong th:text="${username}"></strong>
    </p>

    <p>
        この端末にPasskeyを登録します。
    </p>

    <button type="button" id="registerPasskey">
        Passkeyを登録
    </button>

    <p id="message"></p>

    <script>

        // Base64URL → ArrayBuffer
        function base64UrlToArrayBuffer(base64Url) {

            const padding =
                "=".repeat(
                    (4 - base64Url.length % 4) % 4
                );

            const base64 =
                (base64Url + padding)
                    .replace(/-/g, "+")
                    .replace(/_/g, "/");

            const binary =
                window.atob(base64);

            const bytes =
                new Uint8Array(binary.length);

            for (let i = 0; i < binary.length; i++) {

                bytes[i] =
                    binary.charCodeAt(i);
            }

            return bytes.buffer;
        }


        // ArrayBuffer → Base64URL
        function arrayBufferToBase64Url(buffer) {

            const bytes =
                new Uint8Array(buffer);

            let binary = "";

            for (const byte of bytes) {

                binary +=
                    String.fromCharCode(byte);
            }

            return window.btoa(binary)
                .replace(/\+/g, "-")
                .replace(/\//g, "_")
                .replace(/=/g, "");
        }


        document
            .getElementById("registerPasskey")
            .addEventListener(
                "click",
                async function () {

                    const message =
                        document.getElementById("message");

                    try {

                        message.textContent =
                            "Passkey登録を開始しています……";


                        /*
                         * ① 登録オプション取得
                         */
                        const optionsResponse =
                            await fetch(
                                "/webauthn/register/options",
                                {
                                    method: "POST",
                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    }
                                }
                            );


                        if (!optionsResponse.ok) {

                            throw new Error(
                                "Passkey登録オプションの取得に失敗しました。"
                            );
                        }


                        const options =
                            await optionsResponse.json();


                        const publicKey =
                            options.publicKey || options;
							
							publicKey.authenticatorSelection = {
							    residentKey: "required",
							    userVerification: "preferred"
							};


                        /*
                         * ② challengeを変換
                         */
                        publicKey.challenge =
                            base64UrlToArrayBuffer(
                                publicKey.challenge
                            );


                        /*
                         * ③ user.idを変換
                         */
                        if (
                            publicKey.user &&
                            publicKey.user.id
                        ) {

                            publicKey.user.id =
                                base64UrlToArrayBuffer(
                                    publicKey.user.id
                                );
                        }


                        /*
                         * ④ ブラウザでPasskey作成
                         */
                        const credential =
                            await navigator.credentials.create(
                                {
                                    publicKey:
                                        publicKey
                                }
                            );


                        if (!credential) {

                            throw new Error(
                                "Passkeyの登録がキャンセルされました。"
                            );
                        }


                        /*
                         * ⑤ 登録情報を作成
                         */
                        const credentialData = {

                            publicKey: {

                                credential: {

                                    id:
                                        credential.id,

                                    rawId:
                                        arrayBufferToBase64Url(
                                            credential.rawId
                                        ),

                                    response: {

                                        attestationObject:
                                            arrayBufferToBase64Url(
                                                credential.response
                                                    .attestationObject
                                            ),

                                        clientDataJSON:
                                            arrayBufferToBase64Url(
                                                credential.response
                                                    .clientDataJSON
                                            ),

                                        transports:
                                            credential.response
                                                .getTransports
                                                ? credential.response
                                                    .getTransports()
                                                : []
                                    },

                                    type:
                                        credential.type,

                                    clientExtensionResults:
                                        credential
                                            .getClientExtensionResults(),

                                    authenticatorAttachment:
                                        credential
                                            .authenticatorAttachment
                                },

                                label: "Passkey"
                            }
                        };


                        /*
                         * ⑥ Spring Securityへ登録
                         */
                        const registerResponse =
                            await fetch(
                                "/webauthn/register",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            credentialData
                                        )
                                }
                            );


                        if (!registerResponse.ok) {

                            const errorText =
                                await registerResponse.text();

                            console.error(
                                "Passkey登録エラー:",
                                errorText
                            );

                            throw new Error(
                                "Passkeyの登録に失敗しました。"
                            );
                        }


                        /*
                         * ⑦ 登録成功
                         */
                        message.textContent =
                            "Passkeyの登録が完了しました。";


                        setTimeout(
                            function () {

                                window.location.href =
                                    "/";

                            },
                            1500
                        );


                    } catch (error) {

                        console.error(error);

                        message.textContent =
                            error.message ||
                            "Passkey登録中にエラーが発生しました。";
                    }
                }
            );

    </script>

</body>

</html>
