<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>もう一度パスワードを入力してください</title>
</head>
<body>
	<h1 th:if="${session.authState == 'two-stage'}">
	    2つ目のパスワードを入力してください
	</h1>

	<h1 th:if="${session.authState == 'three-stage-now-step1'}">
	    2つ目のパスワードを入力してください
	</h1>

	<h1 th:if="${session.authState == 'three-stage-now-step2'}">
	    3つ目のパスワードを入力してください
	</h1>

<form action="/password" method="post">
	
	<input type="hidden"
	           th:name="${_csrf.parameterName}"
	           th:value="${_csrf.token}">

    <div>
        <label>ユーザー名</label><p th:text="${session.loginUsername}"></p>

    </div>

    <div>
        <label>パスワード</label>
        <input type="password" name="password" required>
    </div>

    <button type="submit">ログイン</button>

</form>

</body>
</html>
